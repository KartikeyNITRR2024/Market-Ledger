# =============================================================
# Application & Server Configuration
# =============================================================
spring.application.name=data-ingestion-platform
server.port=${SERVER_PORT:1998}
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:local2}

# Multipart upload limits (supports 50MB - 1GB CSV ingestion)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# =============================================================
# Database Configuration (PostgreSQL / Aiven)
# =============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://*********************/defaultdb?sslmode=require&reWriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:****************************}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================
# JPA / Hibernate & Batch Optimization
# =============================================================
# Disable Open-In-View to avoid holding DB connections open across long requests
spring.jpa.open-in-view=false

# Keep 'update' for rapid schema updates, or change to 'validate' if using Flyway migrations
spring.jpa.hibernate.ddl-auto=update

# Keep false during bulk ingestion to prevent I/O blocking on console logging
spring.jpa.show-sql=false

# Hibernate Batch Insert/Update optimizations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# =============================================================
# Redis Configuration (For Queues / Caching / Progress)
# =============================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# =============================================================
# Flyway Database Migration
# =============================================================
# Set to true if managing schema with V1__init.sql in db/migration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# =============================================================
# Security & JWT Properties
# =============================================================
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# =============================================================
# CORS Configuration
# =============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =============================================================
# Custom Ingestion Pipeline Parameters
# =============================================================
ingestion.batch-size=5000
ingestion.worker-threads=4
ingestion.db-worker-threads=4

# =============================================================
# Actuator Health & Metrics
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


app.default.admin.email=${FIRST_ADMIN_EMAIL:admin@gmail.com}
app.default.admin.password=${FIRST_ADMIN_PASSWORD:Admin@12345}